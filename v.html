<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=3.0">
    <title>聖經朗讀 — 視障版</title>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <link rel="apple-touch-icon" href="bible-icon.png">
    <style>
        :root {
            --bg:       #ffffff;
            --bg2:      #f4f6fa;
            --border:   #d0d7e3;
            --text:     #1a1a2e;
            --text2:    #555577;
            --blue:     #1565c0;
            --blue-lt:  #e8f0fe;
            --green:    #1b7a3e;
            --green-lt: #e6f4ea;
            --orange:   #c75000;
            --orange-lt:#fff0e6;
            --red:      #b71c1c;
            --red-lt:   #fdeaea;
            --purple:   #6a1b9a;
            --purple-lt:#f3e5f5;
            --gold:     #f57f17;
            --gold-lt:  #fff8e1;
            --shadow:   0 4px 18px rgba(0,0,0,0.10);
            --shadow-sm:0 2px 8px rgba(0,0,0,0.08);
            --radius:   20px;
            --radius-sm:12px;
            --btn-h:    88px;
            --font-xl:  1.9rem;
            --font-lg:  1.55rem;
            --font-md:  1.25rem;
            --font-sm:  1.05rem;
        }
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background: var(--bg2);
            color: var(--text);
            font-family: "PingFang HK","Noto Sans TC","Heiti TC",sans-serif;
            font-size: var(--font-md);
            line-height: 1.6;
            min-height: 100vh;
            padding-bottom: 80px;
            -webkit-text-size-adjust: 100%;
        }

        /* ── Header ── */
        .site-header {
            background: var(--blue);
            padding: 18px 20px 14px;
            display: flex; align-items: center; justify-content: space-between; gap: 12px;
            position: sticky; top: 0; z-index: 200;
            box-shadow: 0 3px 12px rgba(21,101,192,0.3);
        }
        .site-header h1 { font-size: var(--font-xl); color: #fff; font-weight: 900; flex: 1; }
        .back-link {
            color: #fff; font-size: var(--font-sm); font-weight: bold;
            text-decoration: none; border: 2.5px solid rgba(255,255,255,0.8);
            border-radius: 10px; padding: 8px 14px; white-space: nowrap;
        }
        .back-link:focus { outline: 4px solid #fff; }

        /* ── Main ── */
        .main { padding: 24px 16px; max-width: 680px; margin: 0 auto; }

        /* ── Loading ── */
        #loadingSection { text-align: center; padding: 50px 20px; }
        #loadingSection p { font-size: var(--font-lg); color: var(--blue); font-weight: bold; margin-bottom: 20px; }
        .progress-bar { width: 100%; height: 18px; background: var(--border); border-radius: 9px; overflow: hidden; }
        .progress-fill { height: 100%; background: var(--blue); width: 0%; transition: width 0.3s; }

        /* ── 卡片 ── */
        .card {
            background: var(--bg); border-radius: var(--radius);
            padding: 22px 18px; margin-bottom: 20px;
            box-shadow: var(--shadow-sm); border: 2px solid var(--border);
        }
        .card.highlight { border-color: var(--blue); box-shadow: 0 0 0 3px rgba(21,101,192,0.15), var(--shadow); }

        .step-label {
            display: block; font-size: var(--font-sm); font-weight: 900;
            color: var(--blue); letter-spacing: 0.06em;
            text-transform: uppercase; margin-bottom: 14px;
        }

        /* ── 大按鈕 ── */
        .big-btn {
            width: 100%; min-height: var(--btn-h);
            font-size: var(--font-lg); font-weight: 900;
            border: none; border-radius: var(--radius-sm);
            cursor: pointer; display: flex; align-items: center;
            justify-content: center; gap: 12px; padding: 14px 16px;
            transition: transform 0.1s, box-shadow 0.15s;
            line-height: 1.2; text-align: center;
            box-shadow: var(--shadow-sm);
        }
        .big-btn:active { transform: scale(0.97); box-shadow: none; }
        .big-btn:focus { outline: 4px solid var(--blue); outline-offset: 3px; }
        .big-btn:disabled { opacity: 0.3; cursor: not-allowed; transform: none; }

        .btn-blue   { background: var(--blue);   color: #fff; box-shadow: 0 5px 18px rgba(21,101,192,0.35); }
        .btn-green  { background: var(--green);  color: #fff; box-shadow: 0 5px 18px rgba(27,122,62,0.35); }
        .btn-orange { background: var(--orange); color: #fff; box-shadow: 0 5px 18px rgba(199,80,0,0.35); }
        .btn-red    { background: var(--red);    color: #fff; box-shadow: 0 5px 18px rgba(183,28,28,0.35); }
        .btn-purple { background: var(--purple); color: #fff; box-shadow: 0 5px 18px rgba(106,27,154,0.35); }
        .btn-gold   { background: var(--gold);   color: #fff; box-shadow: 0 5px 18px rgba(245,127,23,0.40); }
        .btn-outline {
            background: var(--bg); color: var(--blue);
            border: 3px solid var(--blue); box-shadow: none;
        }
        .btn-outline:hover { background: var(--blue-lt); }

        .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 20px; }

        /* ══════════════════════════════════════════
           自製大型下拉選單
        ══════════════════════════════════════════ */
        .custom-select-wrap { position: relative; }

        .custom-select-trigger {
            width: 100%; min-height: var(--btn-h);
            background: var(--bg); border: 3px solid var(--blue);
            border-radius: var(--radius-sm); padding: 0 60px 0 20px;
            font-size: var(--font-lg); font-weight: bold; color: var(--text);
            cursor: pointer; display: flex; align-items: center;
            justify-content: space-between; gap: 10px;
            box-shadow: var(--shadow-sm); transition: border-color 0.15s;
            text-align: left;
        }
        .custom-select-trigger:focus { outline: 4px solid var(--blue); outline-offset: 2px; }
        .custom-select-trigger .arrow {
            position: absolute; right: 18px; top: 50%; transform: translateY(-50%);
            font-size: 1.8rem; color: var(--blue); pointer-events: none;
            transition: transform 0.2s;
        }
        .custom-select-trigger.open .arrow { transform: translateY(-50%) rotate(180deg); }
        .custom-select-trigger.placeholder { color: var(--text2); }
        .custom-select-trigger:disabled { opacity: 0.35; cursor: not-allowed; }

        /* 下拉列表覆蓋層 */
        .custom-dropdown {
            display: none; position: fixed;
            left: 0; right: 0; bottom: 0;
            background: var(--bg);
            border-radius: 24px 24px 0 0;
            box-shadow: 0 -8px 40px rgba(0,0,0,0.18);
            z-index: 500;
            max-height: 72vh;
            flex-direction: column;
            overflow: hidden;
        }
        .custom-dropdown.open { display: flex; }

        .dropdown-header {
            padding: 16px 20px 12px;
            border-bottom: 2px solid var(--border);
            display: flex; align-items: center; justify-content: space-between;
            background: var(--bg); flex-shrink: 0;
        }
        .dropdown-title { font-size: var(--font-lg); font-weight: 900; color: var(--blue); }
        .dropdown-close {
            width: 56px; height: 56px; border: none; background: var(--red-lt);
            color: var(--red); font-size: 1.8rem; font-weight: bold;
            border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center;
            flex-shrink: 0;
        }
        .dropdown-close:focus { outline: 4px solid var(--red); }

        .dropdown-list {
            overflow-y: auto; flex: 1;
            -webkit-overflow-scrolling: touch;
        }
        .dropdown-item {
            padding: 22px 24px; font-size: var(--font-lg); font-weight: bold;
            color: var(--text); border-bottom: 1.5px solid var(--bg2);
            cursor: pointer; display: flex; align-items: center; gap: 12px;
            transition: background 0.1s;
        }
        .dropdown-item:active { background: var(--blue-lt); }
        .dropdown-item.selected { background: var(--blue-lt); color: var(--blue); }
        .dropdown-item .item-icon { font-size: 1.4rem; flex-shrink: 0; }

        /* 遮罩 */
        .overlay {
            display: none; position: fixed; inset: 0;
            background: rgba(0,0,0,0.45); z-index: 499;
        }
        .overlay.open { display: block; }

        /* ══════════════════════════════════════════
           語音搜尋
        ══════════════════════════════════════════ */
        .voice-card {
            background: var(--purple-lt); border: 3px solid var(--purple);
            border-radius: var(--radius); padding: 22px 18px; margin-bottom: 20px;
        }
        .voice-label {
            display: block; font-size: var(--font-sm); font-weight: 900;
            color: var(--purple); text-transform: uppercase;
            letter-spacing: 0.06em; margin-bottom: 14px;
        }
        .voice-result-box {
            min-height: 70px; background: var(--bg);
            border: 2.5px solid var(--border); border-radius: var(--radius-sm);
            padding: 14px 16px; margin: 14px 0;
            font-size: var(--font-lg); color: var(--text); font-weight: bold;
            display: none; line-height: 1.5;
        }
        .voice-result-box.active { display: block; border-color: var(--purple); }
        .voice-hint {
            font-size: var(--font-sm); color: var(--text2); margin-top: 10px;
            line-height: 1.6;
        }
        .voice-hint span { color: var(--purple); font-weight: bold; }

        /* ── 語音按鈕動畫 ── */
        @keyframes pulse-ring {
            0%   { transform: scale(1);    opacity: 0.7; }
            50%  { transform: scale(1.08); opacity: 0.4; }
            100% { transform: scale(1);    opacity: 0.7; }
        }
        .listening { animation: pulse-ring 1.2s ease-in-out infinite; }

        /* ── 朗讀狀態 ── */
        #ttsStatusBar {
            display: none; background: var(--green-lt);
            border: 3px solid var(--green); border-radius: var(--radius);
            padding: 18px 20px; margin-bottom: 20px;
        }
        #ttsStatusBar.paused { background: var(--gold-lt); border-color: var(--gold); }
        #ttsStatusBar.done   { background: var(--blue-lt); border-color: var(--blue); }

        .tts-status-label { font-size: var(--font-sm); font-weight: 900; color: var(--green); margin-bottom: 6px; }
        #ttsStatusBar.paused .tts-status-label { color: var(--gold); }
        #ttsStatusBar.done   .tts-status-label { color: var(--blue); }
        #ttsCurrentVerse { font-size: var(--font-xl); font-weight: 900; color: var(--text); }

        /* 語速 */
        .speed-row { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 14px; }
        .speed-btn {
            flex: 1; min-width: 56px; height: 64px;
            background: var(--bg); color: var(--text);
            border: 2.5px solid var(--border); border-radius: var(--radius-sm);
            font-size: var(--font-sm); font-weight: bold; cursor: pointer;
            transition: all 0.15s;
        }
        .speed-btn:focus { outline: 4px solid var(--blue); }
        .speed-btn.sel { background: var(--green); color: #fff; border-color: var(--green); }

        /* ── 經文 ── */
        #scriptureSection { display: none; }
        .scripture-ref {
            font-size: var(--font-xl); font-weight: 900; color: var(--blue);
            margin-bottom: 20px; line-height: 1.3;
        }
        .verse-block {
            padding: 18px 0; border-bottom: 2px solid var(--bg2);
            display: flex; gap: 14px; align-items: flex-start;
            border-radius: 10px; transition: background 0.2s;
        }
        .verse-block:last-child { border-bottom: none; }
        .verse-block.reading {
            background: var(--gold-lt);
            border-bottom-color: var(--gold);
            padding-left: 10px; padding-right: 10px;
        }
        .verse-number {
            font-size: var(--font-md); color: var(--orange); font-weight: 900;
            min-width: 52px; text-align: right; flex-shrink: 0; padding-top: 3px;
        }
        .verse-text { font-size: var(--font-lg); color: var(--text); line-height: 1.8; }

        .sr-only {
            position: absolute; width: 1px; height: 1px;
            padding: 0; margin: -1px; overflow: hidden;
            clip: rect(0,0,0,0); white-space: nowrap; border: 0;
        }

        @keyframes pulse-green {
            0%   { box-shadow: 0 8px 28px rgba(27,122,62,0.45); transform: scale(1); }
            50%  { box-shadow: 0 12px 40px rgba(27,122,62,0.70); transform: scale(1.02); }
            100% { box-shadow: 0 8px 28px rgba(27,122,62,0.45); transform: scale(1); }
        }

        :focus-visible { outline: 4px solid var(--blue) !important; outline-offset: 3px; }

        @media (max-width: 480px) {
            :root { --font-xl: 1.6rem; --font-lg: 1.35rem; --btn-h: 80px; }
        }
    </style>
</head>
<body>

<!-- Header -->
<header class="site-header" role="banner">
    <h1>📖 聖經朗讀</h1>
    <a href="index.html" class="back-link" aria-label="返回標準版">標準版</a>
</header>

<!-- 遮罩 -->
<div class="overlay" id="overlay" onclick="closeAllDropdowns()"></div>

<!-- 自製書卷下拉 -->
<div class="custom-dropdown" id="bookDropdown" role="dialog" aria-modal="true" aria-label="選擇書卷">
    <div class="dropdown-header">
        <span class="dropdown-title">📚 選擇書卷</span>
        <button class="dropdown-close" onclick="closeAllDropdowns()" aria-label="關閉">✕</button>
    </div>
    <div class="dropdown-list" id="bookList" role="listbox" aria-label="書卷列表"></div>
</div>

<!-- 自製章數下拉 -->
<div class="custom-dropdown" id="chapDropdown" role="dialog" aria-modal="true" aria-label="選擇章數">
    <div class="dropdown-header">
        <span class="dropdown-title" id="chapDropdownTitle">📖 選擇章數</span>
        <button class="dropdown-close" onclick="closeAllDropdowns()" aria-label="關閉">✕</button>
    </div>
    <div class="dropdown-list" id="chapList" role="listbox" aria-label="章數列表"></div>
</div>

<main class="main" role="main">

    <!-- 載入進度 -->
    <section id="loadingSection" aria-live="polite">
        <p id="loadingText">正在下載聖經資料庫…</p>
        <div class="progress-bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="progressBar">
            <div class="progress-fill" id="progressFill"></div>
        </div>
    </section>

    <div id="mainControls" style="display:none;">

        <!-- ── 語音搜尋 ── -->
        <div class="voice-card" role="region" aria-label="語音搜尋章節">
            <span class="voice-label">🎙️ 語音搜尋章節</span>
            <button class="big-btn btn-purple" id="voiceBtn"
                onclick="startVoice()"
                aria-label="按此開始語音輸入，說出書卷同章數">
                🎙️ 按此說出章節
            </button>
            <div class="voice-result-box" id="voiceResultBox" aria-live="polite" aria-label="語音識別結果"></div>
            <p class="voice-hint">
                例子：<span>「約翰福音三章」</span>、<span>「詩篇二十三篇」</span>、<span>「創世記一章」</span>
            </p>
        </div>

        <!-- ── 步驟一：選書卷 ── -->
        <div class="card" id="bookCard">
            <span class="step-label" id="step1label">第一步：選書卷</span>
            <div class="custom-select-wrap">
                <button class="custom-select-trigger placeholder" id="bookTrigger"
                    onclick="openDropdown('book')"
                    aria-haspopup="listbox" aria-expanded="false"
                    aria-label="選擇書卷，目前未選擇">
                    <span id="bookTriggerText">── 請選擇書卷 ──</span>
                    <span class="arrow" aria-hidden="true">▾</span>
                </button>
            </div>
        </div>

        <!-- ── 步驟二：選章數 ── -->
        <div class="card" id="chapCard">
            <span class="step-label">第二步：選章數</span>
            <div class="custom-select-wrap">
                <button class="custom-select-trigger placeholder" id="chapTrigger"
                    onclick="openDropdown('chap')"
                    aria-haspopup="listbox" aria-expanded="false"
                    aria-label="選擇章數，請先選書卷"
                    disabled>
                    <span id="chapTriggerText">── 請先選書卷 ──</span>
                    <span class="arrow" aria-hidden="true">▾</span>
                </button>
            </div>
        </div>

        <!-- ── 語速 ── -->
        <div class="card">
            <span class="step-label">朗讀語速</span>
            <div class="speed-row" role="group" aria-label="選擇朗讀語速">
                <button class="speed-btn"     data-rate="0.6" onclick="setSpeed(this)" aria-pressed="false">慢</button>
                <button class="speed-btn"     data-rate="0.8" onclick="setSpeed(this)" aria-pressed="false">稍慢</button>
                <button class="speed-btn sel" data-rate="1.0" onclick="setSpeed(this)" aria-pressed="true">正常</button>
                <button class="speed-btn"     data-rate="1.2" onclick="setSpeed(this)" aria-pressed="false">稍快</button>
                <button class="speed-btn"     data-rate="1.5" onclick="setSpeed(this)" aria-pressed="false">快</button>
            </div>
        </div>

        <!-- ── 上下章 ── -->
        <div class="two-col" id="navRow" style="display:none;">
            <button class="big-btn btn-outline" onclick="prevChap()" aria-label="上一章">❮ 上一章</button>
            <button class="big-btn btn-outline" onclick="nextChap()" aria-label="下一章">下一章 ❯</button>
        </div>

    </div><!-- /mainControls -->

    <!-- ── 朗讀狀態 ── -->
    <div id="ttsStatusBar" role="status" aria-live="polite" aria-atomic="true">
        <div class="tts-status-label" id="ttsLabel">🔊 正在朗讀</div>
        <div id="ttsCurrentVerse"></div>
    </div>

    <!-- ── 朗讀控制 ── -->
    <div id="ttsControls" style="display:none; margin-bottom:20px;">
        <div style="display:grid; grid-template-columns:2fr 1fr; gap:14px;">
            <button class="big-btn btn-green" id="ttsPlayBtn"
                onclick="ttsToggle()" aria-label="開始廣東話朗讀">
                ▶ 開始朗讀
            </button>
            <button class="big-btn btn-red" onclick="ttsStop()" aria-label="停止朗讀">
                ⏹ 停止
            </button>
        </div>
    </div>

    <!-- ── 朗讀提示（揀完章節後出現）── -->
    <div id="readPromptBar" style="display:none; margin-bottom:20px;">
        <button id="readPromptBtn" class="big-btn btn-green"
            style="font-size:2rem; min-height:110px; border-radius:20px; box-shadow: 0 8px 28px rgba(27,122,62,0.45); animation: pulse-green 1.5s ease-in-out infinite;"
            onclick="ttsStart()"
            aria-label="點此開始廣東話朗讀">
            🔊 點此開始朗讀
        </button>
    </div>
    <section id="scriptureSection" aria-label="經文內容">
        <div class="scripture-ref" id="scriptureRef"></div>
        <div id="verseList" role="list"></div>
    </section>

</main>

<div class="sr-only" aria-label="鍵盤快捷鍵：空白鍵 暫停或繼續，Escape 停止，左箭頭 上一章，右箭頭 下一章"></div>

<script>
// ══════════════════════════════════════
// 設定
// ══════════════════════════════════════
const BIBLE_URL = 'https://cokcok1.github.io/bible-ai/chinese_union_trad_trad.txt';

let bibleData  = {};
let bookOrder  = [];
let selectedBook = '';
let selectedChap = 0;

let ttsVerses  = [];
let ttsIndex   = 0;
let ttsPlaying = false;
let ttsPaused  = false;
let ttsRate    = 1.0;
let ttsVoice   = null;

// 書卷名稱對照表（語音辨識用）
// 支援廣東話唸法、普通話、數字章節
const BOOK_ALIASES = {
    '創世記':['創世記','創世','Genesis'],
    '出埃及記':['出埃及記','出埃及','Exodus'],
    '利未記':['利未記','利未','Leviticus'],
    '民數記':['民數記','民數','Numbers'],
    '申命記':['申命記','申命','Deuteronomy'],
    '約書亞記':['約書亞記','約書亞','Joshua'],
    '士師記':['士師記','士師','Judges'],
    '路得記':['路得記','路得','Ruth'],
    '撒母耳記上':['撒母耳記上','撒上','Samuel','1Samuel'],
    '撒母耳記下':['撒母耳記下','撒下','2Samuel'],
    '列王紀上':['列王紀上','王上','Kings','1Kings'],
    '列王紀下':['列王紀下','王下','2Kings'],
    '歷代志上':['歷代志上','代上','Chronicles','1Chronicles'],
    '歷代志下':['歷代志下','代下','2Chronicles'],
    '以斯拉記':['以斯拉記','以斯拉','Ezra'],
    '尼希米記':['尼希米記','尼希米','Nehemiah'],
    '以斯帖記':['以斯帖記','以斯帖','Esther'],
    '約伯記':['約伯記','約伯','Job'],
    '詩篇':['詩篇','詩','Psalms','Psalm'],
    '箴言':['箴言','箴','Proverbs'],
    '傳道書':['傳道書','傳道','Ecclesiastes'],
    '雅歌':['雅歌','Song'],
    '以賽亞書':['以賽亞書','以賽亞','Isaiah'],
    '耶利米書':['耶利米書','耶利米','Jeremiah'],
    '耶利米哀歌':['耶利米哀歌','哀歌','Lamentations'],
    '以西結書':['以西結書','以西結','Ezekiel'],
    '但以理書':['但以理書','但以理','Daniel'],
    '何西阿書':['何西阿書','何西阿','Hosea'],

// ══════════════════════════════════════
// 初始化
// ══════════════════════════════════════
window.onload = async function() {
    initVoice();
    await loadBible();
    setupKeyboard();
};

function initVoice() {
    if (!('speechSynthesis' in window)) return;
    const findVoice = () => {
        const vs = window.speechSynthesis.getVoices();
        ttsVoice = vs.find(v => v.lang === 'zh-HK')
                || vs.find(v => v.lang.startsWith('zh-HK'))
                || vs.find(v => v.lang.startsWith('zh'))
                || null;
    };
    findVoice();
    window.speechSynthesis.onvoiceschanged = findVoice;
}

// ══════════════════════════════════════
// 載入聖經
// ══════════════════════════════════════
async function loadBible() {
    try {
        const res = await fetch(BIBLE_URL);
        if (!res.ok) throw new Error('網絡錯誤');
        const reader = res.body.getReader();
        const total  = +res.headers.get('Content-Length');
        let recv = 0, chunks = [];
        while (true) {
            const { done, value } = await reader.read();
            if (done) break;
            chunks.push(value);
            recv += value.length;
            if (total) {
                const pct = Math.round(recv / total * 100);
                document.getElementById('progressFill').style.width = pct + '%';
                document.getElementById('progressBar').setAttribute('aria-valuenow', pct);
            }
        }
        document.getElementById('loadingText').textContent = '解析中…';
        parseBible(new TextDecoder('utf-8').decode(concatArrays(chunks)));
        document.getElementById('loadingSection').style.display = 'none';
        document.getElementById('mainControls').style.display = 'block';
        populateBookDropdown();
    } catch (e) {
        document.getElementById('loadingText').textContent = '載入失敗：' + e.message;
    }
}

function concatArrays(arrays) {
    const len = arrays.reduce((s,a) => s + a.length, 0);
    const out = new Uint8Array(len);
    let p = 0;
    for (const a of arrays) { out.set(a, p); p += a.length; }
    return out;
}

function parseBible(raw) {
    const re = /^(.+?)\s+(\d+):(\d+)\s+(.*)$/;
    for (const line of raw.split('\n')) {
        const m = line.trim().match(re);
        if (!m) continue;
        const [, book, chap, ver, content] = m;
        const c = parseInt(chap), v = parseInt(ver);
        if (!bibleData[book]) { bibleData[book] = {}; bookOrder.push(book); }
        if (!bibleData[book][c]) bibleData[book][c] = {};
        bibleData[book][c][v] = content;
    }
}

// ══════════════════════════════════════
// 自製下拉選單
// ══════════════════════════════════════
function populateBookDropdown() {
    const list = document.getElementById('bookList');
    bookOrder.forEach((b, i) => {
        const item = document.createElement('div');
        item.className = 'dropdown-item';
        item.setAttribute('role', 'option');
        item.setAttribute('aria-selected', 'false');
        item.setAttribute('tabindex', '0');
        item.dataset.value = b;
        item.innerHTML = `<span class="item-icon">📗</span>${b}`;
        item.onclick = () => selectBook(b);
        item.onkeydown = (e) => { if (e.key === 'Enter' || e.key === ' ') selectBook(b); };
        list.appendChild(item);
    });
}

function populateChapDropdown(book) {
    const list = document.getElementById('chapList');
    list.innerHTML = '';
    document.getElementById('chapDropdownTitle').textContent = `📖 ${book} — 選章數`;
    const chaps = Object.keys(bibleData[book]).map(Number).sort((a,b)=>a-b);
    chaps.forEach(c => {
        const item = document.createElement('div');
        item.className = 'dropdown-item';
        item.setAttribute('role', 'option');
        item.setAttribute('aria-selected', 'false');
        item.setAttribute('tabindex', '0');
        item.dataset.value = c;
        item.innerHTML = `<span class="item-icon">📄</span>第 ${c} 章`;
        item.onclick = () => selectChap(c);
        item.onkeydown = (e) => { if (e.key === 'Enter' || e.key === ' ') selectChap(c); };
        list.appendChild(item);
    });
}

function openDropdown(type) {
    if (type === 'chap' && !selectedBook) return;
    const dropId  = type === 'book' ? 'bookDropdown' : 'chapDropdown';
    const trigger = type === 'book' ? 'bookTrigger'  : 'chapTrigger';
    document.getElementById(dropId).classList.add('open');
    document.getElementById('overlay').classList.add('open');
    document.getElementById(trigger).classList.add('open');
    document.getElementById(trigger).setAttribute('aria-expanded', 'true');
    // 聚焦第一個項目
    setTimeout(() => {
        const first = document.querySelector(`#${dropId === 'bookDropdown' ? 'bookList' : 'chapList'} .dropdown-item`);
        if (first) first.focus();
    }, 100);
}

function closeAllDropdowns() {
    ['bookDropdown','chapDropdown'].forEach(id => {
        document.getElementById(id).classList.remove('open');
    });
    document.getElementById('overlay').classList.remove('open');
    document.getElementById('bookTrigger').classList.remove('open');
    document.getElementById('chapTrigger').classList.remove('open');
    document.getElementById('bookTrigger').setAttribute('aria-expanded','false');
    document.getElementById('chapTrigger').setAttribute('aria-expanded','false');
}

function selectBook(book) {
    selectedBook = book;
    // 更新觸發器
    const trigger = document.getElementById('bookTrigger');
    trigger.classList.remove('placeholder');
    document.getElementById('bookTriggerText').textContent = book;
    trigger.setAttribute('aria-label', `書卷：${book}，點擊更改`);
    // 標記 selected
    document.querySelectorAll('#bookList .dropdown-item').forEach(el => {
        el.classList.toggle('selected', el.dataset.value === book);
        el.setAttribute('aria-selected', el.dataset.value === book ? 'true' : 'false');
    });
    // 準備章數下拉
    populateChapDropdown(book);
    const chapTrigger = document.getElementById('chapTrigger');
    chapTrigger.disabled = false;
    chapTrigger.classList.add('placeholder');
    document.getElementById('chapTriggerText').textContent = '── 請選擇章數 ──';
    chapTrigger.setAttribute('aria-label', `選擇 ${book} 章數`);
    closeAllDropdowns();
    ttsStop(false);
    // 自動打開章數下拉
    setTimeout(() => openDropdown('chap'), 250);
}

function selectChap(chap) {
    selectedChap = chap;
    const trigger = document.getElementById('chapTrigger');
    trigger.classList.remove('placeholder');
    document.getElementById('chapTriggerText').textContent = `第 ${chap} 章`;
    trigger.setAttribute('aria-label', `章數：第 ${chap} 章，點擊更改`);
    document.querySelectorAll('#chapList .dropdown-item').forEach(el => {
        const v = parseInt(el.dataset.value);
        el.classList.toggle('selected', v === chap);
        el.setAttribute('aria-selected', v === chap ? 'true' : 'false');
    });
    closeAllDropdowns();

    // 停止現有 TTS
    ttsPlaying = false;
    ttsPaused  = false;
    window.speechSynthesis.cancel();
    clearHighlight();
    updateTtsUI();

    // 渲染經文
    renderScripture(selectedBook, selectedChap);

    // iOS Safari 要求 TTS 必須直接由用戶手勢觸發
    // 顯示大型「立即朗讀」提示按鈕，用戶點一下即開始
    showReadPrompt();
}

// ══════════════════════════════════════
// 語音搜尋
// ══════════════════════════════════════
function startVoice() {
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SpeechRecognition) {
        alert('你的裝置不支援語音輸入，請使用 iPhone Safari。');
        return;
    }

    const btn = document.getElementById('voiceBtn');
    const resultBox = document.getElementById('voiceResultBox');

    const recog = new SpeechRecognition();
    recog.lang = 'zh-HK';
    recog.continuous = false;
    recog.interimResults = false;
    recog.maxAlternatives = 3;

    btn.innerHTML = '🔴 聆聽中…請說出章節';
    btn.classList.add('listening');
    btn.disabled = true;
    resultBox.className = 'voice-result-box active';
    resultBox.textContent = '聆聽中…';

    recog.onresult = (event) => {
        const transcript = event.results[0][0].transcript;
        resultBox.textContent = `你說：「${transcript}」`;
        parseVoiceInput(transcript);
    };

    recog.onerror = (e) => {
        resultBox.textContent = `語音錯誤：${e.error}，請再試。`;
    };

    recog.onend = () => {
        btn.innerHTML = '🎙️ 按此說出章節';
        btn.classList.remove('listening');
        btn.disabled = false;
    };

    recog.start();
}

function parseVoiceInput(text) {
    const resultBox = document.getElementById('voiceResultBox');

    // 1. 比對書卷
    // 關鍵：將所有 alias 攤平並按長度由長到短排序
    // 確保「約翰一書」先於「約翰」匹配，避免短名稱搶先
    let matchedBook = null;
    const allAliases = [];
    for (const [canonical, aliases] of Object.entries(BOOK_ALIASES)) {
        if (!bibleData[canonical]) continue;
        for (const alias of aliases) {
            allAliases.push({ canonical, alias });
        }
    }
    // 亦加入 bookOrder 本身（正式書卷名）
    for (const b of bookOrder) {
        allAliases.push({ canonical: b, alias: b });
    }
    // 由長到短排序，長嘅優先匹配
    allAliases.sort((a, b) => b.alias.length - a.alias.length);

    for (const { canonical, alias } of allAliases) {
        if (text.includes(alias)) {
            matchedBook = canonical;
            break;
        }
    }

    // 2. 比對章數
    let matchedChap = null;

    // 先試中文數字（由長到短避免 "十一" 先被 "一" 截走）
    const zhKeys = Object.keys(ZH_NUMS).sort((a,b) => b.length - a.length);
    for (const zh of zhKeys) {
        const re = new RegExp(zh + '[章篇]');
        if (re.test(text)) { matchedChap = ZH_NUMS[zh]; break; }
    }
    // 再試阿拉伯數字
    if (!matchedChap) {
        const m = text.match(/(\d+)\s*[章篇]/);
        if (m) matchedChap = parseInt(m[1]);
    }

    if (!matchedBook && !matchedChap) {
        resultBox.textContent += '\n❌ 未能識別書卷或章數，請再試。';
        return;
    }

    // 3. 執行跳轉
    if (matchedBook && matchedChap) {
        if (!bibleData[matchedBook]?.[matchedChap]) {
            resultBox.textContent += `\n❌ ${matchedBook} 冇第 ${matchedChap} 章`;
            return;
        }
        resultBox.textContent += `\n✅ 跳去 ${matchedBook} 第 ${matchedChap} 章`;
        selectBook(matchedBook);
        setTimeout(() => selectChap(matchedChap), 300);

    } else if (matchedBook) {
        resultBox.textContent += `\n✅ 已選 ${matchedBook}，請再說章數`;
        selectBook(matchedBook);

    } else {
        // 只有章數，搵當前書卷
        if (selectedBook && bibleData[selectedBook]?.[matchedChap]) {
            resultBox.textContent += `\n✅ 跳去 ${selectedBook} 第 ${matchedChap} 章`;
            selectChap(matchedChap);
        } else {
            resultBox.textContent += `\n❓ 請先選擇書卷`;
        }
    }
}

// ══════════════════════════════════════
// 上下章
// ══════════════════════════════════════
function prevChap() {
    if (!selectedBook) return;
    const prev = selectedChap - 1;
    if (bibleData[selectedBook]?.[prev]) {
        selectChap(prev);
    } else {
        const idx = bookOrder.indexOf(selectedBook);
        if (idx > 0) {
            const prevBook = bookOrder[idx - 1];
            const chaps = Object.keys(bibleData[prevBook]).map(Number);
            selectBook(prevBook);
            setTimeout(() => selectChap(Math.max(...chaps)), 300);
        }
    }
}

function nextChap() {
    if (!selectedBook) return;
    const nxt = selectedChap + 1;
    if (bibleData[selectedBook]?.[nxt]) {
        selectChap(nxt);
    } else {
        const idx = bookOrder.indexOf(selectedBook);
        if (idx < bookOrder.length - 1) {
            const nextBook = bookOrder[idx + 1];
            selectBook(nextBook);
            setTimeout(() => selectChap(1), 300);
        }
    }
}

// ══════════════════════════════════════
// 渲染經文
// ══════════════════════════════════════
function renderScripture(book, chap) {
    document.getElementById('scriptureRef').textContent = `${book} 第 ${chap} 章`;
    const verseData = bibleData[book][chap];
    const nums = Object.keys(verseData).map(Number).sort((a,b)=>a-b);
    ttsVerses = nums.map(n => ({ num: n, text: verseData[n] }));

    const list = document.getElementById('verseList');
    list.innerHTML = '';
    ttsVerses.forEach(({ num, text }) => {
        const block = document.createElement('div');
        block.className = 'verse-block';
        block.id = `verse-${num}`;
        block.setAttribute('role', 'listitem');
        block.setAttribute('aria-label', `第 ${num} 節：${text}`);

        const numEl = document.createElement('div');
        numEl.className = 'verse-number';
        numEl.setAttribute('aria-hidden', 'true');
        numEl.textContent = num;

        const textEl = document.createElement('div');
        textEl.className = 'verse-text';
        textEl.textContent = text;

        block.appendChild(numEl);
        block.appendChild(textEl);
        list.appendChild(block);
    });

    document.getElementById('scriptureSection').style.display = 'block';
    document.getElementById('ttsControls').style.display = 'none'; // 等用戶點「點此開始朗讀」先顯示
    document.getElementById('navRow').style.display = 'grid';
}

// ══════════════════════════════════════
// 語速
// ══════════════════════════════════════
function setSpeed(btn) {
    document.querySelectorAll('.speed-btn').forEach(b => {
        b.classList.remove('sel');
        b.setAttribute('aria-pressed', 'false');
    });
    btn.classList.add('sel');
    btn.setAttribute('aria-pressed', 'true');
    ttsRate = parseFloat(btn.dataset.rate);
    if (ttsPlaying && !ttsPaused) {
        window.speechSynthesis.cancel();
        setTimeout(speakCurrent, 100);
    }
}

// ══════════════════════════════════════
// TTS
// ══════════════════════════════════════

// iOS Safari 要求 TTS 必須直接由用戶手勢觸發
// 揀完章節後顯示大型「立即朗讀」提示，用戶點一下即開始
function showReadPrompt() {
    const bar = document.getElementById('readPromptBar');
    bar.style.display = 'block';
    bar.scrollIntoView({ behavior: 'smooth', block: 'center' });
    setTimeout(() => document.getElementById('readPromptBtn').focus(), 350);
}

function hideReadPrompt() {
    document.getElementById('readPromptBar').style.display = 'none';
}

function ttsToggle() {
    if (!('speechSynthesis' in window)) {
        alert('你的裝置不支援語音朗讀，請使用 iPhone Safari。');
        return;
    }
    if (!ttsVerses.length) return;

    if (!ttsPlaying) {
        ttsIndex = 0; ttsPlaying = true; ttsPaused = false;
        updateTtsUI(); speakCurrent();
    } else if (!ttsPaused) {
        window.speechSynthesis.pause();
        ttsPaused = true; updateTtsUI();
    } else {
        window.speechSynthesis.resume();
        ttsPaused = false; updateTtsUI();
    }
}

function ttsStart() {
    if (!('speechSynthesis' in window) || !ttsVerses.length) return;
    hideReadPrompt();
    document.getElementById('ttsControls').style.display = 'block'; // 點咗先顯示控制欄
    window.speechSynthesis.cancel();
    ttsIndex = 0; ttsPlaying = true; ttsPaused = false;
    updateTtsUI(); speakCurrent();
}

function ttsStop(scrollTop = true) {
    ttsPlaying = false; ttsPaused = false;
    if ('speechSynthesis' in window) window.speechSynthesis.cancel();
    clearHighlight(); updateTtsUI();
    const bar = document.getElementById('ttsStatusBar');
    bar.style.display = 'none';
    // 停止後隱藏控制欄，重新顯示「點此開始朗讀」（若有經文）
    if (ttsVerses.length) {
        document.getElementById('ttsControls').style.display = 'none';
        showReadPrompt();
    }
    if (scrollTop) window.scrollTo({ top: 0, behavior: 'smooth' });
}

function speakCurrent() {
    if (!ttsPlaying || ttsIndex >= ttsVerses.length) { ttsFinish(); return; }
    const { num, text } = ttsVerses[ttsIndex];
    highlightVerse(ttsIndex);

    const bar = document.getElementById('ttsStatusBar');
    bar.style.display = 'block';
    bar.className = '';
    document.getElementById('ttsLabel').textContent = '🔊 正在朗讀';
    document.getElementById('ttsCurrentVerse').textContent = `第 ${num} 節`;

    const el = document.getElementById(`verse-${num}`);
    if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' });

    const utt = new SpeechSynthesisUtterance(text);
    utt.lang  = 'zh-HK';
    utt.rate  = ttsRate;
    if (ttsVoice) utt.voice = ttsVoice;

    utt.onend   = () => { if (!ttsPlaying) return; ttsIndex++; setTimeout(speakCurrent, 250); };
    utt.onerror = (e) => { if (e.error === 'interrupted' || e.error === 'canceled') return; ttsFinish(); };

    window.speechSynthesis.speak(utt);
}

function ttsFinish() {
    ttsPlaying = false; ttsPaused = false;
    clearHighlight(); updateTtsUI();
    const bar = document.getElementById('ttsStatusBar');
    bar.style.display = 'block';
    bar.className = 'done';
    document.getElementById('ttsLabel').textContent = '✅ 朗讀完畢';
    document.getElementById('ttsCurrentVerse').textContent = '願神的話語祝福你 🙏';
    setTimeout(() => {
        bar.style.display = 'none';
        document.getElementById('ttsControls').style.display = 'none';
        showReadPrompt(); // 完畢後重新顯示大按鈕
    }, 4000);
}

function highlightVerse(idx) {
    clearHighlight();
    const el = document.getElementById(`verse-${ttsVerses[idx]?.num}`);
    if (el) el.classList.add('reading');
}

function clearHighlight() {
    document.querySelectorAll('.verse-block.reading').forEach(el => el.classList.remove('reading'));
}

function updateTtsUI() {
    const btn = document.getElementById('ttsPlayBtn');
    if (!ttsPlaying) {
        btn.innerHTML = '▶ 開始朗讀';
        btn.className = 'big-btn btn-green';
        btn.setAttribute('aria-label', '開始廣東話朗讀');
    } else if (ttsPaused) {
        btn.innerHTML = '▶ 繼續朗讀';
        btn.className = 'big-btn btn-orange';
        btn.setAttribute('aria-label', '繼續朗讀');
    } else {
        btn.innerHTML = '⏸ 暫停';
        btn.className = 'big-btn btn-gold';
        btn.setAttribute('aria-label', '暫停朗讀');
    }
}

function setupKeyboard() {
    document.addEventListener('keydown', (e) => {
        if (['INPUT','TEXTAREA','SELECT'].includes(e.target.tagName)) return;
        if (e.key === ' ')          { e.preventDefault(); if (ttsVerses.length) ttsToggle(); }
        if (e.key === 'Escape')     { closeAllDropdowns(); ttsStop(); }
        if (e.key === 'ArrowLeft')  { e.preventDefault(); prevChap(); }
        if (e.key === 'ArrowRight') { e.preventDefault(); nextChap(); }
    });
}
