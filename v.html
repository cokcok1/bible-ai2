<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>廣東話聖經朗讀</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600&display=swap">
<style>
:root{--bg:#eef1f5;--panel:#fff;--ink:#1b2433;--mute:#5d6b80;--accent:#1f6f78;--hl:#ffe9a8;--line:#d5dbe4;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121821;--panel:#1b2330;--ink:#e8edf4;--mute:#93a1b5;--accent:#4fb3bf;--hl:#4a3f12;--line:#2c3746}}
:root[data-theme="dark"]{--bg:#121821;--panel:#1b2330;--ink:#e8edf4;--mute:#93a1b5;--accent:#4fb3bf;--hl:#4a3f12;--line:#2c3746}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Noto Serif TC","PMingLiU","Songti TC",serif;line-height:1.9}
main{max-width:640px;margin:0 auto;padding:20px 16px 48px}
h1{font-size:1.35rem;margin:0 0 4px}
.sub{color:var(--mute);font-size:.85rem;margin:0 0 20px;line-height:1.6}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
.mic{display:flex;align-items:center;gap:14px}
button{font:inherit;cursor:pointer;color:var(--ink)}
button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
#mic{width:72px;height:72px;flex:none;border-radius:50%;border:0;background:var(--accent);color:#fff;font-size:1.9rem;user-select:none;-webkit-user-select:none}
#mic.on{background:#c0392b;animation:pulse 1.2s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 12px rgba(192,57,43,.2)}}
@media (prefers-reduced-motion:reduce){#mic.on{animation:none}}
#heard{font-size:.95rem;color:var(--mute);min-height:1.9em}
#msg{font-size:.9rem;margin-top:4px}
.err{color:#c0392b}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
select,input[type=text]{font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);min-width:0}
input[type=text]{flex:1}
.btn{padding:9px 16px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
.btn.main{background:var(--accent);border-color:var(--accent);color:#fff}
label.file{display:block;font-size:.9rem;color:var(--mute);margin-bottom:8px}
#stat{font-size:.85rem;color:var(--mute);margin-top:8px}
#title{font-size:1.15rem;font-weight:600;margin:0 0 10px}
.v{padding:4px 8px;border-radius:6px;cursor:pointer;font-size:1.08rem}
.v sup{color:var(--mute);font-size:.7rem;margin-right:6px}
.v.now{background:var(--hl)}
.ctl{position:sticky;bottom:0;background:var(--panel);border-top:1px solid var(--line);padding:10px 0 4px;margin-top:12px}
small{color:var(--mute)}
</style>
</head>
<body>
<main>
<h1>廣東話聖經朗讀</h1>
<p class="sub">撳咪高峰，講「創世記第一章」，就會讀出全章。</p>

<section class="panel">
  <div class="mic">
    <button id="mic" aria-label="開始語音輸入">🎤</button>
    <div>
      <div id="heard">未有語音輸入</div>
      <div id="msg"></div>
    </div>
  </div>
</section>

<section class="panel">
  <label class="file" for="f">載入你嘅和合本 text file（UTF-8，每節一行，例如「創世記 1:1 起初，神創造天地。」）</label>
  <input id="f" type="file" accept=".txt,text/plain">
  <div id="stat"></div>
</section>

<section class="panel">
  <div class="row">
    <select id="bk" aria-label="書卷"></select>
    <select id="ch" aria-label="章"></select>
    <input id="typed" type="text" placeholder="或者打字：約翰福音 3" aria-label="打字輸入">
    <button class="btn" id="go">前往</button>
  </div>
</section>

<section class="panel">
  <h2 id="title"></h2>
  <div id="text"></div>
  <div class="ctl">
    <div class="row">
      <button class="btn main" id="play">▶ 朗讀</button>
      <button class="btn" id="pause">⏸ 暫停</button>
      <button class="btn" id="stop">⏹ 停止</button>
      <label>速度 <input id="rate" type="range" min="0.6" max="1.4" step="0.1" value="0.9"></label>
    </div>
    <small id="voice"></small>
  </div>
</section>
</main>

<script>
// ---------- 書卷對應表與標準化 ----------
const BOOK_LIST="創世記:創,出埃及記:出,利未記:利,民數記:民,申命記:申,約書亞記:書,士師記:士,路得記:得,撒母耳記上:撒上,撒母耳記下:撒下,列王紀上:王上,列王紀下:王下,歷代志上:代上,歷代志下:代下,以斯拉記:拉,尼希米記:尼,以斯帖記:斯,約伯記:伯,詩篇:詩,箴言:箴,傳道書:傳,雅歌:歌,以賽亞書:賽,耶利米書:耶,耶利米哀歌:哀,以西結書:結,但以理書:但,何西阿書:何,約珥書:珥,阿摩司書:摩,俄巴底亞書:俄,約拿書:拿,彌迦書:彌,那鴻書:鴻,哈巴谷書:哈,西番雅書:番,哈該書:該,撒迦利亞書:亞,瑪拉基書:瑪,馬太福音:太,馬可福音:可,路加福音:路,約翰福音:約,使徒行傳:徒,羅馬書:羅,哥林多前書:林前,哥林多後書:林後,加拉太書:加,以弗所書:弗,腓立比書:腓,歌羅西書:西,帖撒羅尼迦前書:帖前,帖撒羅尼迦後書:帖後,提摩太前書:提前,提摩太後書:提後,提多書:多,腓利門書:門,希伯來書:來,雅各書:雅,彼得前書:彼前,彼得後書:彼後,約翰一書:約壹,約翰二書:約貳,約翰三書:約參,猶大書:猶,啟示錄:啟".split(",").map(s=>s.split(":"));
const BOOKS=BOOK_LIST.map(b=>b[0]);

// 加入 "歌":"哥" 與 "啓":"啟" 的異體/同音字映射
const S2T={"歌":"哥","啓":"啟","记":"記","书":"書","约":"約","罗":"羅","马":"馬","后":"後","门":"門","来":"來","犹":"猶","启":"啟","显":"顯","诗":"詩","传":"傳","赛":"賽","结":"結","弥":"彌","鸿":"鴻","该":"該","亚":"亞","玛":"瑪","创":"創","经":"經","纪":"紀","历":"歷","撒":"撒","帖":"帖","腓":"腓","参":"參","贰":"貳","壹":"壹","数":"數","师":"師","说":"說","神":"神"};
const norm=s=>s.replace(/[\s，。、：:；;！!？?「」『』"'()（）]/g,"").replace(/./g,c=>S2T[c]||c);

const aliasMap=new Map();
BOOK_LIST.forEach(([full,abbr])=>{
  const al=[full,abbr,full.replace(/記/g,"紀"),full.replace(/[記書]/,"")];
  if(full.endsWith("福音"))al.push(full.slice(0,-2));
  
  // 自動補足別名相容
  if(full.includes("哥林多")) al.push(full.replace(/哥/g,"歌"));
  if(full.includes("啟示錄")) al.push(full.replace(/啟/g,"啓"));

  al.forEach(a=>{
    if(a){
      aliasMap.set(a,full);
      aliasMap.set(norm(a),full);
    }
  });
});
const aliases=[...aliasMap.keys()].sort((a,b)=>b.length-a.length);

function cn2num(s){
  if(/^\d+$/.test(s))return +s;
  const d={零:0,〇:0,一:1,二:2,兩:2,三:3,四:4,五:5,六:6,七:7,八:8,九:9};
  let n=0,cur=0;
  for(const c of s){
    if(c in d)cur=d[c];
    else if(c==="十"){n+=(cur||1)*10;cur=0}
    else if(c==="百"){n+=(cur||1)*100;cur=0}
  }
  return n+cur;
}

function parseQuery(text){
  const s=norm(text);
  const a=aliases.find(a=>s.includes(a));
  if(!a)return null;
  const rest=s.slice(s.indexOf(a)+a.length);
  const m=rest.match(/[0-9零〇一二兩三四五六七八九十百]+/);
  return {book:aliasMap.get(a),chapter:m?cn2num(m[0]):1};
}

// ---------- 經文資料處理 ----------
let data={};
const DEMO="創世記 1:1 起初，神創造天地。\n創世記 1:2 地是空虛混沌，淵面黑暗；神的靈運行在水面上。\n創世記 1:3 神說：「要有光」，就有了光。\n創世記 1:4 神看光是好的，就把光暗分開了。\n創世記 1:5 神稱光為晝，稱暗為夜。有晚上，有早晨，這是頭一日。";

function load(txt){
  const d={};let n=0,bad=new Set();
  const lines = txt.replace(/^\uFEFF/,"").split(/\r?\n/);

  for(let i=0; i<lines.length; i++){
    const line = lines[i].trim();
    if(!line) continue;

    const colonIdx = line.indexOf(':') !== -1 ? line.indexOf(':') : line.indexOf('：');
    if(colonIdx === -1) continue;

    const left = line.slice(0, colonIdx).trim();
    const right = line.slice(colonIdx + 1).trim();

    const spaceIdx = left.lastIndexOf(' ');
    let rawBook = "", chStr = "";
    if(spaceIdx !== -1){
      rawBook = left.slice(0, spaceIdx).trim();
      chStr = left.slice(spaceIdx + 1).trim();
    } else {
      const match = left.match(/^([^\d]+)(\d+)$/);
      if(match){ rawBook = match[1]; chStr = match[2]; }
    }

    const vMatch = right.match(/^(\d+)\s*(.*)$/);
    if(!rawBook || !chStr || !vMatch) continue;

    const ch = +chStr;
    const v = +vMatch[1];
    const text = vMatch[2];

    const normBook = norm(rawBook);
    const book = aliasMap.get(normBook) || aliasMap.get(rawBook);

    if(book){
      ((d[book]??={})[ch]??=[]).push({v, t: text});
      n++;
    } else {
      bad.add(rawBook);
    }
  }
  return {d, n, bad:[...bad]};
}

function setData(txt,label){
  stat("正在載入經文資料...");
  setTimeout(()=>{
    const r=load(txt);
    if(!r.n){stat("讀唔到經文。請檢查格式係咪類似「創世記 1:1 起初…」。",true);return}
    data=r.d;
    const books=Object.keys(data);
    stat(`${label}：${books.length} 卷、${r.n} 節`+(r.bad.length?`；未能對應書卷名：${r.bad.slice(0,5).join("、")}`:""));
    fillBooks();
    show($("bk").value, 1);
  }, 30);
}

function stat(t,err){const e=document.getElementById("stat");e.textContent=t;e.className=err?"err":""}

// ---------- UI 互動控制 ----------
const $=id=>document.getElementById(id);

function fillBooks(){
  const names=Object.keys(data).sort((a,b)=>(BOOKS.indexOf(a)+1||999)-(BOOKS.indexOf(b)+1||999));
  $("bk").innerHTML=names.map(n=>`<option>${n}</option>`).join("");
  fillChapters();
}

function fillChapters(){
  const chs=Object.keys(data[$("bk").value]||{}).map(Number).sort((a,b)=>a-b);
  $("ch").innerHTML=chs.map(c=>`<option value="${c}">第${c}章</option>`).join("");
}

let cur=[],idx=0,token=0,playing=false;

function show(book,ch){
  stopSpeech();
  const verses=(data[book]||{})[ch];
  if(!verses){msg(`搵唔到「${book}」第 ${ch} 章。`,true);return false}
  $("bk").value=book;fillChapters();$("ch").value=ch;
  cur=verses.slice().sort((a,b)=>a.v-b.v);idx=0;
  $("title").textContent=`${book} 第${ch}章`;
  $("text").innerHTML=cur.map((x,i)=>`<div class="v" data-i="${i}"><sup>${x.v}</sup>${x.t}</div>`).join("");
  msg("");return true;
}

function msg(t,err){const e=$("msg");e.textContent=t;e.className=err?"err":""}
$("bk").onchange=()=>{fillChapters();show($("bk").value,+$("ch").value)};
$("ch").onchange=()=>show($("bk").value,+$("ch").value);
$("text").onclick=e=>{const v=e.target.closest(".v");if(v){idx=+v.dataset.i;speakFrom(idx)}};
$("f").onchange=async e=>{
  const f=e.target.files[0];if(!f)return;
  setData(await f.text(),f.name);
};

function goText(t){
  const q=parseQuery(t);
  $("heard").textContent=t?`「${t}」`:"";
  if(!q){msg("聽唔明係邊卷書，請再講一次，例如「創世記第一章」。",true);return}
  if(show(q.book,q.chapter))speakFrom(0);
}

$("go").onclick=()=>goText($("typed").value);
$("typed").onkeydown=e=>{if(e.key==="Enter")goText($("typed").value)};

// ---------- TTS 語音朗讀 ----------
const synth=window.speechSynthesis;
let voice=null;

function pickVoice(){
  if(!synth) return;
  const vs=synth.getVoices();
  voice=vs.find(v=>/yue|zh[-_]HK/i.test(v.lang))||vs.find(v=>/zh[-_]TW|zh[-_]Hant/i.test(v.lang))||vs.find(v=>/^zh/i.test(v.lang))||null;
  $("voice").textContent=voice?`語音：${voice.name}（${voice.lang}）`:"呢部裝置搵唔到廣東話/中文語音，會採用系統預設。";
}
if(synth){pickVoice();synth.onvoiceschanged=pickVoice}

function speakFrom(i){
  if(!synth){msg("呢個瀏覽器唔支援朗讀功能。",true);return}
  synth.cancel();
  const my=++token;idx=i;playing=true;
  (function next(){
    if(my!==token||idx>=cur.length){if(my===token)mark(-1);playing=false;return}
    mark(idx);
    const u=new SpeechSynthesisUtterance(cur[idx].t.replace(/[(（][^)）]*[)）]/g,"").replace(/[〈〉「」『』]/g,""));
    u.lang="zh-HK";if(voice)u.voice=voice;u.rate=+$("rate").value;
    u.onend=()=>{if(my===token){idx++;next()}};
    u.onerror=()=>{if(my===token){idx++;next()}};
    synth.speak(u);
  })();
}

function mark(i){
  document.querySelectorAll(".v").forEach(el=>el.classList.toggle("now",+el.dataset.i===i));
  const el=document.querySelector(".v.now");if(el)el.scrollIntoView({block:"center",behavior:"smooth"});
}

function stopSpeech(){token++;playing=false;if(synth)synth.cancel();mark(-1)}
$("play").onclick=()=>{if(synth&&synth.paused){synth.resume()}else if(cur.length)speakFrom(idx)};
$("pause").onclick=()=>synth&&synth.pause();
$("stop").onclick=stopSpeech;

// ---------- Web Speech 語音輸入 ----------
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
let rec=null;

$("mic").onclick=()=>{
  if(!SR){
    msg("呢個瀏覽器唔支援標準語音識別 API，請用 Chrome/Edge，或直接輸入文字/手機輸入法聽寫。",true);
    return;
  }
  if(rec){rec.stop();return}
  stopSpeech();
  rec=new SR();rec.lang="zh-HK";rec.interimResults=false;rec.maxAlternatives=3;
  rec.onstart=()=>{$("mic").classList.add("on");$("heard").textContent="請講…";msg("")};
  rec.onresult=e=>{
    const alts=[...e.results[0]].map(a=>a.transcript);
    const best=alts.find(t=>parseQuery(t))||alts[0];
    goText(best);
  };
  rec.onerror=e=>msg(e.error==="not-allowed"?"請允許使用咪高峰權限。":"語音輸入出錯（"+e.error+"），請再試。",true);
  rec.onend=()=>{$("mic").classList.remove("on");rec=null};
  rec.start();
};

// ---------- 初始化載入 ----------
setData(DEMO,"示範經文（創世記 1:1–5）");

const SRCS=["chinese_union_trad_trad.txt","https://cokcok1.github.io/bible-ai2/chinese_union_trad_trad.txt"];
(async()=>{
  for(const u of SRCS){
    try{
      const r=await fetch(u);if(!r.ok)continue;
      setData(await r.text(),"和合本");
      return;
    }catch(e){}
  }
  stat("自動載入和合本失敗，請用上方選擇檔案載入。",true);
})();
</script>
</body>
</html>
